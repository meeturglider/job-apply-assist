[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "job-apply-assist"
version = "0.1.0"
description = "Local, evidence-based ATS resume tailoring assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Harisankar" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "playwright>=1.48",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "trafilatura>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.7",
  "types-PyYAML>=6.0",
]

[project.scripts]
job-assist = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "data/*.yaml",
  "rendering/templates/*.html",
  "web/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
